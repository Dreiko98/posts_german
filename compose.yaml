name: german-content-studio
x-backend: &backend
  build:
    context: ./backend
  image: german-content-studio-api:local
  environment:
    DATABASE_URL: postgresql+psycopg://studio:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}@db:5432/studio
    MASTER_KEY: ${MASTER_KEY:?Define MASTER_KEY}
    APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    APP_NAME: ${APP_NAME:-Germán Content Studio}
    LINKEDIN_VERSION: ${LINKEDIN_VERSION:-202609}
    DATA_DIR: /data
  volumes:
    - files:/data
  restart: unless-stopped
  stop_grace_period: 120s
services:
  db:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U studio -d studio"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    <<: *backend
    command: [sh, -c, "alembic upgrade head && exec uvicorn app.api:app --host 0.0.0.0 --port 8000 --no-access-log --proxy-headers --forwarded-allow-ips='*'"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
  worker:
    <<: *backend
    command: [python, -m, app.worker]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -m, app.cli, worker-health]
      interval: 30s
      timeout: 5s
      retries: 5
  web:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  database:
  files:
